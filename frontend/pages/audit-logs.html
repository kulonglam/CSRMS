<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs - CSRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🏪 CSRMS</a>
            <button class="btn btn-outline-light btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <ul class="sidebar-menu">
                    <li><a href="dashboard-director.html"><i class="fas fa-chart-line me-2"></i>Dashboard</a></li>
                    <li><a href="categories.html"><i class="fas fa-list me-2"></i>Categories</a></li>
                    <li><a href="products.html"><i class="fas fa-box me-2"></i>Products</a></li>
                    <li><a href="branches.html"><i class="fas fa-sitemap me-2"></i>Branches</a></li>
                    <li><a href="users.html"><i class="fas fa-users me-2"></i>Users</a></li>
                    <li><a href="inventory.html"><i class="fas fa-warehouse me-2"></i>Inventory</a></li>
                    <li><a href="sales.html"><i class="fas fa-shopping-cart me-2"></i>Sales</a></li>
                    <li><a href="reports.html"><i class="fas fa-file-chart-line me-2"></i>Reports</a></li>
                    <li><a href="#" class="active"><i class="fas fa-history me-2"></i>Audit Logs</a></li>
                </ul>
            </div>

            <div class="col-md-10 p-4">
                <div class="dashboard-header">
                    <h1><i class="fas fa-history me-2"></i>Audit Logs</h1>
                    <p>View system activity and changes</p>
                </div>
                <div class="table-container">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Action</th>
                                <th>User</th>
                                <th>Timestamp</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="auditTable">
                            <tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Audit Log Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="detailsContent"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        requireAuth();

        // Format JSON data into readable key-value pairs
        function formatJsonData(jsonData) {
            if (!jsonData) return '-';
            try {
                const obj = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
                return Object.entries(obj)
                    .map(([key, value]) => `<strong>${key}:</strong> ${JSON.stringify(value)}`)
                    .join('<br>');
            } catch (e) {
                return JSON.stringify(jsonData);
            }
        }

        // Show details in modal
        function showDetails(log) {
            const newValues = log.new_values ? formatJsonData(log.new_values) : null;
            const oldValues = log.old_values ? formatJsonData(log.old_values) : null;
            
            let content = `
                <div class="details-section">
                    <h6>Basic Information</h6>
                    <p><strong>ID:</strong> ${log.id}</p>
                    <p><strong>Action:</strong> ${log.action}</p>
                    <p><strong>User:</strong> ${log.user_name || 'System'}</p>
                    <p><strong>Table:</strong> ${log.table_name || '-'}</p>
                    <p><strong>Record ID:</strong> ${log.record_id || '-'}</p>
                    <p><strong>Timestamp:</strong> ${formatDate(log.created_at)}</p>
                    <p><strong>IP Address:</strong> ${log.ip_address || '-'}</p>
                </div>
            `;
            
            if (oldValues) {
                content += `<div class="details-section mt-3">
                    <h6>Previous Values</h6>
                    <div class="bg-light p-3 rounded">${oldValues}</div>
                </div>`;
            }
            
            if (newValues) {
                content += `<div class="details-section mt-3">
                    <h6>New Values</h6>
                    <div class="bg-light p-3 rounded">${newValues}</div>
                </div>`;
            }
            
            document.getElementById('detailsContent').innerHTML = content;
            new bootstrap.Modal(document.getElementById('detailsModal')).show();
        }

        async function loadAuditLogs() {
            try {
                const data = await api.getAuditLogs();
                if (data.success) {
                    displayLogs(data.data || []);
                } else {
                    showError(data.message || 'Failed to load audit logs');
                    document.getElementById('auditTable').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Error loading logs: ' + (data.message || 'Unknown error') + '</td></tr>';
                }
            } catch (error) {
                console.error('Failed to load audit logs', error);
                showError('Failed to load audit logs: ' + error.message);
                document.getElementById('auditTable').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Error: ' + error.message + '</td></tr>';
            }
        }

        function displayLogs(logs) {
            const html = logs.map(log => {
                const summary = log.new_values ? Object.keys(JSON.parse(log.new_values)).slice(0, 2).join(', ') : 
                               (log.old_values ? Object.keys(JSON.parse(log.old_values)).slice(0, 2).join(', ') : '-');
                return `
                <tr>
                    <td>${log.id}</td>
                    <td>${log.action}</td>
                    <td>${log.user_name || 'System'}</td>
                    <td>${formatDate(log.created_at)}</td>
                    <td><button class="btn btn-sm btn-primary" onclick="showDetails(${JSON.stringify(log).replace(/"/g, '&quot;')})">View Details</button></td>
                </tr>
            `;
            }).join('') || '<tr><td colspan="5" class="text-center text-muted">No logs found</td></tr>';
            document.getElementById('auditTable').innerHTML = html;
        }

        async function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                try {
                    await auth.logout();
                    window.location.href = '../index.html';
                } catch (error) {
                    console.error('Logout failed');
                }
            }
        }

        window.addEventListener('DOMContentLoaded', loadAuditLogs);
    </script>
</body>
</html>
