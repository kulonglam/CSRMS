<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs - CSRMS</title>
<link rel="stylesheet" href="../css/style.css">
    <script src="../js/layout.js"></script>
</head>
<body>
        <div id="appNavbar"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <ul class="sidebar-menu" id="sidebarMenu"></ul>
            </div>

            <div class="col-md-10 p-4">
                <div class="dashboard-header d-flex justify-content-between align-items-start flex-wrap gap-2">
                    <div>
                        <h1><i class="fas fa-history me-2"></i><span id="pageTitle">Audit Logs</span></h1>
                        <p id="pageSubtitle">View system activity and changes</p>
                    </div>
                    <button type="button" class="btn btn-outline-primary btn-sm no-print" id="exportAuditBtn" style="display:none">
                        <i class="fas fa-file-csv me-1"></i>Export CSV
                    </button>
                </div>

                <!-- Filters -->
                <div class="row mb-3">
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="actionFilter" placeholder="Filter by action..." onkeyup="debouncedLoad()">
                    </div>
                    <div class="col-md-3">
                        <select class="form-control" id="tableFilter" onchange="loadAuditLogs()">
                            <option value="">All Tables</option>
                            <option value="products">Products</option>
                            <option value="categories">Categories</option>
                            <option value="users">Users</option>
                            <option value="branches">Branches</option>
                            <option value="sales">Sales</option>
                            <option value="inventory">Inventory</option>
                            <option value="product_barcodes">Barcodes</option>
                            <option value="cashier_balancing">Cashier Balancing</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="date" class="form-control" id="fromDate" onchange="loadAuditLogs()">
                    </div>
                    <div class="col-md-2">
                        <input type="date" class="form-control" id="toDate" onchange="loadAuditLogs()">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-outline-secondary w-100" onclick="clearFilters()">
                            <i class="fas fa-times me-1"></i>Clear
                        </button>
                    </div>
                </div>

                <div class="table-container">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Log ID</th>
                                <th class="actions-col">Action</th>
                                <th>User</th>
                                <th>Table</th>
                                <th>Record ID</th>
                                <th>Timestamp</th>
                                <th class="actions-col">Details</th>
                            </tr>
                        </thead>
                        <tbody id="auditTable">
                            <tr><td colspan="7" class="text-center text-muted py-4">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
                <p class="text-muted small mt-2" id="logCount"></p>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Audit Log Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detailsContent"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    
    <script>
        CSRMSLayout.boot(async () => {requireAuth();

        const user = auth.getCurrentUser();

        if (!auth.hasRole(['director', 'manager', 'sales_agent'])) {
            showError('Unauthorized access');
            setTimeout(() => auth.redirectToDashboard(), 1500);
        }

        initPage('audit-logs');
        if (isAgent()) {
            document.getElementById('pageTitle').textContent = 'Activity Log';
            document.getElementById('pageSubtitle').textContent = 'View your recent system activity';
        } else {
            document.getElementById('exportAuditBtn').style.display = '';
            document.getElementById('exportAuditBtn').addEventListener('click', exportAuditLogs);
        }

        let allLogs = [];

        function parseJsonField(data) {
            if (!data) return null;
            if (typeof data === 'object') return data;
            try {
                return JSON.parse(data);
            } catch {
                return null;
            }
        }

        function formatJsonData(jsonData) {
            const obj = parseJsonField(jsonData);
            if (!obj) return '-';
            return Object.entries(obj)
                .map(([key, value]) => `<strong>${key}:</strong> ${typeof value === 'object' ? JSON.stringify(value) : value}`)
                .join('<br>');
        }

        function getRecordId(log) {
            const stored = log.record_id ?? log.recordId;
            if (stored != null && stored !== '') return stored;
            const data = parseJsonField(log.new_values) || parseJsonField(log.old_values);
            if (data?.id != null) return data.id;
            if (log.table_name === 'users' && log.user_id != null) return log.user_id;
            return null;
        }

        function getLogSummary(log) {
            const recordId = getRecordId(log);
            const data = parseJsonField(log.new_values) || parseJsonField(log.old_values);
            if (!data) {
                return recordId != null ? `Record #${recordId}` : (log.table_name ? '—' : '—');
            }
            const keys = Object.keys(data).filter(k => k !== 'id');
            const fields = keys.slice(0, 2).map(k => `${k}: ${data[k]}`).join(', ');
            if (recordId != null && fields) return `#${recordId} · ${fields}`;
            if (recordId != null) return `Record #${recordId}`;
            return fields || '—';
        }

        function getActionBadge(action) {
            const map = {
                CREATE: 'bg-success',
                UPDATE: 'bg-warning text-dark',
                DELETE: 'bg-danger',
                CREATE_SALE: 'bg-success',
                VOID_SALE: 'bg-danger',
                STOCK_ADJUSTMENT: 'bg-info',
                LOGIN: 'bg-primary',
                LOGOUT: 'bg-secondary',
            };
            const prefix = Object.keys(map).find(k => action.startsWith(k));
            const cls = prefix ? map[prefix] : 'bg-secondary';
            return `<span class="badge ${cls}">${action}</span>`;
        }

        function showDetails(id) {
            const log = allLogs.find(l => l.id === id);
            if (!log) return;

            const newValues = formatJsonData(log.new_values);
            const oldValues = formatJsonData(log.old_values);

            let content = `
                <div class="details-section">
                    <h6>Basic Information</h6>
                    <table class="table table-sm">
                        <tr><th style="width:30%">ID</th><td>${log.id}</td></tr>
                        <tr><th>Action</th><td>${getActionBadge(log.action)}</td></tr>
                        <tr><th>User</th><td>${log.user_name || 'System'}${log.user_role ? ` (${log.user_role})` : ''}</td></tr>
                        <tr><th>Table</th><td>${log.table_name || '—'}</td></tr>
                        <tr><th>Record ID</th><td>${getRecordId(log) ?? '—'}</td></tr>
                        <tr><th>Timestamp</th><td>${formatDate(log.created_at)}</td></tr>
                        <tr><th>IP Address</th><td>${log.ip_address || '—'}</td></tr>
                    </table>
                </div>`;

            if (oldValues !== '-') {
                content += `<div class="mt-3"><h6>Previous Values</h6><div class="bg-light p-3 rounded">${oldValues}</div></div>`;
            }
            if (newValues !== '-') {
                content += `<div class="mt-3"><h6>New Values</h6><div class="bg-light p-3 rounded">${newValues}</div></div>`;
            }

            document.getElementById('detailsContent').innerHTML = content;
            new bootstrap.Modal(document.getElementById('detailsModal')).show();
        }

        async function loadAuditLogs() {
            const params = {};
            const action = document.getElementById('actionFilter').value.trim();
            const table_name = document.getElementById('tableFilter').value;
            const from_date = document.getElementById('fromDate').value;
            const to_date = document.getElementById('toDate').value;

            if (action) params.action = action;
            if (table_name) params.table_name = table_name;
            if (from_date) params.from_date = from_date;
            if (to_date) params.to_date = to_date + 'T23:59:59';

            try {
                const data = await api.getAuditLogs(params);
                if (data.success) {
                    allLogs = data.data || [];
                    displayLogs(allLogs);
                    document.getElementById('logCount').textContent =
                        `Showing ${allLogs.length} log${allLogs.length !== 1 ? 's' : ''} (most recent 200)`;
                } else {
                    showError(data.message || 'Failed to load audit logs');
                }
            } catch (error) {
                showError('Failed to load audit logs: ' + error.message);
                document.getElementById('auditTable').innerHTML =
                    `<tr><td colspan="7" class="text-center text-danger">${error.message}</td></tr>`;
            }
        }

        function displayLogs(logs) {
            document.getElementById('auditTable').innerHTML = logs.map(log => {
                const recordId = getRecordId(log);
                return `
                <tr>
                    <td>${log.id}</td>
                    <td class="actions-col">${getActionBadge(log.action)}</td>
                    <td>${log.user_name || 'System'}</td>
                    <td>${log.table_name || '—'}</td>
                    <td>${recordId != null ? recordId : '—'}</td>
                    <td>${formatDate(log.created_at)}</td>
                    <td class="actions-col">
                        <div class="action-buttons">
                        <button type="button" class="btn btn-sm btn-info btn-audit-details" data-log-id="${log.id}">
                            <i class="fas fa-eye"></i>
                        </button>
                        <small class="text-muted">${getLogSummary(log)}</small>
                        </div>
                    </td>
                </tr>
            `;
            }).join('') || '<tr><td colspan="7" class="text-center text-muted">No logs found</td></tr>';
        }

        function clearFilters() {
            document.getElementById('actionFilter').value = '';
            document.getElementById('tableFilter').value = '';
            document.getElementById('fromDate').value = '';
            document.getElementById('toDate').value = '';
            loadAuditLogs();
        }

        async function exportAuditLogs() {
            const params = {};
            const action = document.getElementById('actionFilter').value.trim();
            const table_name = document.getElementById('tableFilter').value;
            const from_date = document.getElementById('fromDate').value;
            const to_date = document.getElementById('toDate').value;
            if (action) params.action = action;
            if (table_name) params.table_name = table_name;
            if (from_date) params.from_date = from_date;
            if (to_date) params.to_date = to_date + 'T23:59:59';
            try {
                await api.downloadAuditLogsCsv(params);
                showSuccess('Audit log export downloaded');
            } catch (error) {
                showError(error.message || 'Failed to export audit logs');
            }
        }

        const debouncedLoad = debounce(loadAuditLogs, 300);

        document.getElementById('auditTable').addEventListener('click', (e) => {
            const btn = e.target.closest('.btn-audit-details');
            if (btn) showDetails(Number(btn.dataset.logId));
        });

        loadAuditLogs();
        CSRMSLayout.expose(loadAuditLogs, clearFilters, { debouncedLoad });
    }, {});
    </script>
</body>
</html>
