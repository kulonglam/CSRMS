<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — CSRMS</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/layout.js"></script>
</head>
<body>
    <main class="login-container">
        <div class="login-box">
            <div class="text-center mb-2">
                <div class="brand-mark" aria-hidden="true"><i class="fas fa-lock"></i></div>
                <div class="brand-text">New password</div>
                <div class="subtitle">Choose a secure password for your account</div>
            </div>
            <div id="formFeedback" class="d-none mb-3" role="alert"></div>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <div class="password-toggle-wrap">
                        <input type="password" class="form-control" id="newPassword" minlength="8" autocomplete="new-password" required>
                        <button type="button" class="password-toggle-btn" data-toggle-for="newPassword" aria-label="Show password" aria-pressed="false">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="password-toggle-wrap">
                        <input type="password" class="form-control" id="confirmPassword" minlength="8" autocomplete="new-password" required>
                        <button type="button" class="password-toggle-btn" data-toggle-for="confirmPassword" aria-label="Show password" aria-pressed="false">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="submitBtn">Update password</button>
            </form>
            <div class="text-center mt-3">
                <a href="../index.html" class="auth-link">Back to sign in</a>
            </div>
        </div>
    </main>

    <div class="modal fade" id="passwordSuccessModal" tabindex="-1" aria-labelledby="passwordSuccessTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="passwordSuccessTitle">
                        <i class="fas fa-check-circle me-2 text-success" aria-hidden="true"></i>Password updated
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Your password has been reset. You can now sign in with your new credentials.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="passwordSuccessContinue">Go to sign in</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        CSRMSLayout.boot(async () => {
            const token = new URLSearchParams(window.location.search).get('token');
            const feedback = document.getElementById('formFeedback');
            const submitBtn = document.getElementById('submitBtn');
            const successModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('passwordSuccessModal'));

            function setFormFeedback(message, type) {
                if (!message) {
                    feedback.className = 'd-none mb-3';
                    feedback.textContent = '';
                    return;
                }
                feedback.className = `alert alert-${type} mb-3`;
                feedback.textContent = message;
            }

            if (!token) {
                setFormFeedback('Invalid reset link. Request a new one.', 'danger');
                submitBtn.disabled = true;
            }

            document.querySelectorAll('.password-toggle-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const input = document.getElementById(btn.dataset.toggleFor);
                    const icon = btn.querySelector('i');
                    const show = input.type === 'password';
                    input.type = show ? 'text' : 'password';
                    icon.classList.toggle('fa-eye', !show);
                    icon.classList.toggle('fa-eye-slash', show);
                    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                    btn.setAttribute('aria-pressed', show ? 'true' : 'false');
                });
            });

            document.getElementById('passwordSuccessContinue').addEventListener('click', () => {
                window.location.href = '../index.html';
            });

            document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                setFormFeedback('');

                const newPass = document.getElementById('newPassword').value;
                const confirm = document.getElementById('confirmPassword').value;

                if (newPass !== confirm) {
                    setFormFeedback('Passwords do not match.', 'danger');
                    return;
                }

                submitBtn.disabled = true;
                try {
                    const res = await api.resetPassword(token, newPass);
                    if (res.success) {
                        document.getElementById('resetPasswordForm').reset();
                        successModal.show();
                    } else {
                        setFormFeedback(res.message || 'Failed to reset password.', 'danger');
                    }
                } catch (err) {
                    setFormFeedback(err.message || 'Failed to reset password.', 'danger');
                } finally {
                    submitBtn.disabled = false;
                }
            });
        }, { nav: false, utils: false, styles: true });
    </script>
</body>
</html>
