<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - CSRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="text-center mb-4">
                <div class="brand-text">🔑 New Password</div>
                <div class="subtitle">Choose a new password for your account</div>
            </div>
            <form onsubmit="handleReset(event)">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" class="form-control" id="newPassword" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-login">Reset Password</button>
            </form>
            <div class="text-center mt-3">
                <a href="../index.html">Back to login</a>
            </div>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        if (!token) {
            showError('Invalid reset link. Request a new one.');
        }

        async function handleReset(e) {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (newPass !== confirm) { showError('Passwords do not match'); return; }
            try {
                const res = await api.resetPassword(token, newPass);
                if (res.success) {
                    showSuccess(res.message);
                    setTimeout(() => window.location.href = '../index.html', 2000);
                }
            } catch (err) { showError(err.message); }
        }
    </script>
</body>
</html>
