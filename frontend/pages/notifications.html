<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - CSRMS</title>
<link rel="stylesheet" href="../css/style.css">
    <script src="../js/layout.js"></script>
</head>
<body>
        <div id="appNavbar"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar"><ul class="sidebar-menu" id="sidebarMenu"></ul></div>
            <div class="col-md-10 p-4">
                <div class="dashboard-header d-flex justify-content-between align-items-center">
                    <div><h1><i class="fas fa-bell me-2"></i>Notifications</h1><p>Stock alerts and system notifications</p></div>
                    <button class="btn btn-outline-secondary btn-sm" onclick="markAllRead()"><i class="fas fa-check-double me-1"></i>Mark All Read</button>
                </div>

                <div class="row mb-3">
                    <div class="col-md-3">
                        <select class="form-control" id="typeFilter" onchange="loadNotifications()">
                            <option value="">All Types</option>
                            <option value="low_stock">Low Stock</option>
                            <option value="out_of_stock">Out of Stock</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-control" id="readFilter" onchange="loadNotifications()">
                            <option value="">All</option>
                            <option value="false">Unread</option>
                            <option value="true">Read</option>
                        </select>
                    </div>
                </div>

                <div id="notificationsList"><div class="text-center text-muted py-5">Loading...</div></div>
            </div>
        </div>
    </div>

    
    <script>
        CSRMSLayout.boot(async () => {requireAuth();
        if (!isManager()) { showError('Manager access required'); setTimeout(() => auth.redirectToDashboard(), 1500); }
        initPage('notifications');

        function getTypeBadge(type) {
            return type === 'out_of_stock'
                ? '<span class="badge bg-danger">Out of Stock</span>'
                : '<span class="badge bg-warning text-dark">Low Stock</span>';
        }

        async function loadNotifications() {
            const params = {};
            const read = document.getElementById('readFilter').value;
            if (read) params.is_read = read;
            try {
                const res = await api.getNotifications(params);
                let items = res.success ? res.data : [];
                const type = document.getElementById('typeFilter').value;
                if (type) items = items.filter(n => n.type === type);

                document.getElementById('notificationsList').innerHTML = items.length ? items.map(n => `
                    <div class="table-container p-3 mb-2 ${n.is_read ? '' : 'border-start border-4 border-warning'}">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                ${getTypeBadge(n.type)}
                                <strong class="ms-2">${n.product_name || 'System'}</strong>
                                <p class="mb-1 mt-1 text-muted">${n.message}</p>
                                <small class="text-muted">${formatDate(n.created_at)} · ${n.branch_name || ''}</small>
                            </div>
                            <div>${!n.is_read ? `<button class="btn btn-sm btn-outline-primary" onclick="markRead(${n.id})">Mark Read</button>` : '<span class="badge bg-secondary">Read</span>'}</div>
                        </div>
                    </div>
                `).join('') : '<div class="text-center text-muted py-5">No notifications</div>';
            } catch (e) { showError(e.message); }
        }

        async function markRead(id) {
            await api.markNotificationRead(id);
            loadNotifications();
            loadNotificationBadge();
        }

        async function markAllRead() {
            await api.markAllNotificationsRead();
            showSuccess('All notifications marked as read');
            loadNotifications();
            loadNotificationBadge();
        }
        loadNotifications();
        CSRMSLayout.expose(loadNotifications, markRead, markAllRead);
    }, {});
    </script>
</body>
</html>
