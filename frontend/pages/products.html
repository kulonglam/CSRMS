<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - CSRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🏪 CSRMS</a>
            <div class="d-flex align-items-center gap-2">
                <span class="text-light me-3">
                    <i class="fas fa-user-circle me-2"></i><span id="userName">User</span>
                </span>
                <button class="btn btn-outline-light btn-sm" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <ul class="sidebar-menu">
                    <li><a href="dashboard-director.html"><i class="fas fa-chart-line me-2"></i>Dashboard</a></li>
                    <li><a href="categories.html"><i class="fas fa-list me-2"></i>Categories</a></li>
                    <li><a href="#" class="active"><i class="fas fa-box me-2"></i>Products</a></li>
                    <li><a href="branches.html"><i class="fas fa-sitemap me-2"></i>Branches</a></li>
                    <li><a href="users.html"><i class="fas fa-users me-2"></i>Users</a></li>
                    <li><a href="inventory.html"><i class="fas fa-warehouse me-2"></i>Inventory</a></li>
                    <li><a href="sales.html"><i class="fas fa-shopping-cart me-2"></i>Sales</a></li>
                    <li><a href="reports.html"><i class="fas fa-file-chart-line me-2"></i>Reports</a></li>
                    <li><a href="audit-logs.html"><i class="fas fa-history me-2"></i>Audit Logs</a></li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <div class="dashboard-header d-flex justify-content-between align-items-center">
                    <div>
                        <h1><i class="fas fa-box me-2"></i>Products</h1>
                        <p>Manage your product inventory</p>
                    </div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal" onclick="resetForm()">
                        <i class="fas fa-plus me-2"></i>Add Product
                    </button>
                </div>

                <!-- Search & Filter -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="searchInput" placeholder="Search products..." onkeyup="filterTable()">
                    </div>
                    <div class="col-md-6">
                        <select class="form-control" id="categoryFilter" onchange="filterTable()">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTable">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-4">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="productForm" onsubmit="saveProduct(event)">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-control" id="productCategory" required>
                                <option value="">Select Category</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Cost Price</label>
                                    <input type="number" class="form-control" id="productCostPrice" step="0.01" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Selling Price</label>
                                    <input type="number" class="form-control" id="productSellingPrice" step="0.01" required>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                                <div class="mb-3">
                                    <label class="form-label">Reorder Level</label>
                                    <input type="number" class="form-control" id="productReorder" value="10">
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-control" id="productStatus">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>

    <script>
        requireAuth();
        document.getElementById('userName').textContent = auth.getCurrentUser()?.full_name || 'User';

        let allProducts = [];
        let allCategories = [];
        let editingId = null;

        async function loadData() {
            try {
                const [productsData, categoriesData] = await Promise.all([
                    api.getProducts(),
                    api.getCategories()
                ]);

                if (productsData.success) {
                    allProducts = productsData.data || [];
                    displayProducts(allProducts);
                }

                if (categoriesData.success) {
                    allCategories = categoriesData.data || [];
                    populateCategorySelects();
                }
            } catch (error) {
                showError('Failed to load data');
            }
        }

        function populateCategorySelects() {
            const categorySelect = document.getElementById('productCategory');
            const filterSelect = document.getElementById('categoryFilter');

            categorySelect.innerHTML = '<option value="">Select Category</option>' +
                allCategories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');

            filterSelect.innerHTML = '<option value="">All Categories</option>' +
                allCategories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
        }

        function displayProducts(products) {
            const html = products.map(prod => `
                <tr>
                    <td>${prod.id}</td>
                    <td>${prod.name}</td>
                    <td>${prod.category_name || 'N/A'}</td>
                    <td>${formatCurrency(prod.price)}</td>
                    <td>${prod.quantity_in_stock}</td>
                    <td>${getStatusBadge(prod.status)}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-sm btn-warning" onclick="editProduct(${prod.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteProduct(${prod.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="7" class="text-center text-muted">No products found</td></tr>';
            document.getElementById('productsTable').innerHTML = html;
        }

        function filterTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const categoryId = document.getElementById('categoryFilter').value;

            const filtered = allProducts.filter(prod => {
                const matchesSearch = prod.name.toLowerCase().includes(searchTerm);
                const matchesCategory = !categoryId || prod.category_id === parseInt(categoryId);
                return matchesSearch && matchesCategory;
            });

            displayProducts(filtered);
        }

        function resetForm() {
            editingId = null;
            document.getElementById('productForm').reset();
            document.getElementById('modalTitle').textContent = 'Add Product';
        }

        function editProduct(id) {
            const product = allProducts.find(p => p.id === id);
            if (product) {
                editingId = id;
                document.getElementById('productName').value = product.name;
                document.getElementById('productCategory').value = product.category_id;
                document.getElementById('productCostPrice').value = product.cost_price;
                document.getElementById('productSellingPrice').value = product.price;
                document.getElementById('productReorder').value = product.reorder_level;
                document.getElementById('productStatus').value = product.status;
                document.getElementById('modalTitle').textContent = 'Edit Product';
                new bootstrap.Modal(document.getElementById('productModal')).show();
            }
        }

        async function saveProduct(event) {
            event.preventDefault();

            const data = {
                name: document.getElementById('productName').value.trim(),
                category_id: parseInt(document.getElementById('productCategory').value),
                cost_price: parseFloat(document.getElementById('productCostPrice').value),
                selling_price: parseFloat(document.getElementById('productSellingPrice').value),
                reorder_level: parseInt(document.getElementById('productReorder').value),
                status: document.getElementById('productStatus').value
            };

            if (!data.name || !data.category_id || !data.cost_price || !data.selling_price) {
                showError('Please fill all required fields');
                return;
            }

            try {
                let response;
                if (editingId) {
                    response = await api.updateProduct(editingId, data);
                } else {
                    response = await api.createProduct(data);
                }

                if (response.success) {
                    showSuccess(editingId ? 'Product updated' : 'Product created');
                    bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
                    loadData();
                } else {
                    showError(response.message);
                }
            } catch (error) {
                showError(error.message);
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Are you sure?')) return;
            try {
                const response = await api.deleteProduct(id);
                if (response.success) {
                    showSuccess('Product deleted');
                    loadData();
                } else {
                    showError(response.message);
                }
            } catch (error) {
                showError(error.message);
            }
        }

        async function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                try {
                    await auth.logout();
                    showSuccess('Logged out successfully');
                    setTimeout(() => window.location.href = '../index.html', 1000);
                } catch (error) {
                    showError('Logout failed');
                }
            }
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
