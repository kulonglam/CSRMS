<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - CSRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🏪 CSRMS</a>
            <div class="d-flex align-items-center gap-2">
                <span class="text-light me-3">
                    <i class="fas fa-user-circle me-2"></i><span id="userName">User</span>
                </span>
                <button class="btn btn-outline-light btn-sm" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <ul class="sidebar-menu">
                    <li><a href="dashboard-director.html"><i class="fas fa-chart-line me-2"></i>Dashboard</a></li>
                    <li><a href="categories.html"><i class="fas fa-list me-2"></i>Categories</a></li>
                    <li><a href="products.html"><i class="fas fa-box me-2"></i>Products</a></li>
                    <li><a href="branches.html"><i class="fas fa-sitemap me-2"></i>Branches</a></li>
                    <li><a href="#" class="active"><i class="fas fa-users me-2"></i>Users</a></li>
                    <li><a href="inventory.html"><i class="fas fa-warehouse me-2"></i>Inventory</a></li>
                    <li><a href="sales.html"><i class="fas fa-shopping-cart me-2"></i>Sales</a></li>
                    <li><a href="reports.html"><i class="fas fa-file-chart-line me-2"></i>Reports</a></li>
                    <li><a href="audit-logs.html"><i class="fas fa-history me-2"></i>Audit Logs</a></li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <div class="dashboard-header d-flex justify-content-between align-items-center">
                    <div>
                        <h1><i class="fas fa-users me-2"></i>Users</h1>
                        <p>Manage system users and permissions</p>
                    </div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal" onclick="resetForm()">
                        <i class="fas fa-plus me-2"></i>Add User
                    </button>
                </div>

                <!-- Search & Filter -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="searchInput" placeholder="Search users..." onkeyup="filterTable()">
                    </div>
                    <div class="col-md-6">
                        <select class="form-control" id="roleFilter" onchange="filterTable()">
                            <option value="">All Roles</option>
                            <option value="director">Director</option>
                            <option value="manager">Manager</option>
                            <option value="sales_agent">Sales Agent</option>
                        </select>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Username</th>
                                <th>Role</th>
                                <th>Branch</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-4">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="userForm" onsubmit="saveUser(event)">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="userName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="userUsername" required>
                        </div>
                        <div class="mb-3" id="passwordDiv">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="userPassword">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select class="form-control" id="userRole" required>
                                <option value="">Select Role</option>
                                <option value="director">Director</option>
                                <option value="manager">Manager</option>
                                <option value="sales_agent">Sales Agent</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Branch</label>
                            <select class="form-control" id="userBranch">
                                <option value="">No Branch (Directors Only)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-control" id="userStatus">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>

    <script>
        requireAuth();
        document.getElementById('userName').textContent = auth.getCurrentUser()?.full_name || 'User';

        let allUsers = [];
        let allBranches = [];
        let editingId = null;

        async function loadData() {
            try {
                const [usersData, branchesData] = await Promise.all([
                    api.getUsers(),
                    api.getBranches()
                ]);

                if (usersData.success) {
                    allUsers = usersData.data || [];
                    displayUsers(allUsers);
                }

                if (branchesData.success) {
                    allBranches = branchesData.data || [];
                    populateBranchSelect();
                }
            } catch (error) {
                showError('Failed to load data');
            }
        }

        function populateBranchSelect() {
            const branchSelect = document.getElementById('userBranch');
            branchSelect.innerHTML = '<option value="">No Branch (Directors Only)</option>' +
                allBranches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
        }

        function displayUsers(users) {
            const html = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.full_name}</td>
                    <td>${user.username}</td>
                    <td>${getRoleBadge(user.role)}</td>
                    <td>${user.branch_name || '-'}</td>
                    <td>${getStatusBadge(user.status)}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-sm btn-warning" onclick="editUser(${user.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="resetPassword(${user.id})">
                                <i class="fas fa-key"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="7" class="text-center text-muted">No users found</td></tr>';
            document.getElementById('usersTable').innerHTML = html;
        }

        function filterTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const role = document.getElementById('roleFilter').value;

            const filtered = allUsers.filter(user => {
                const matchesSearch = user.full_name.toLowerCase().includes(searchTerm) || 
                                     user.username.toLowerCase().includes(searchTerm);
                const matchesRole = !role || user.role === role;
                return matchesSearch && matchesRole;
            });

            displayUsers(filtered);
        }

        function resetForm() {
            editingId = null;
            document.getElementById('userForm').reset();
            document.getElementById('modalTitle').textContent = 'Add User';
            document.getElementById('passwordDiv').style.display = 'block';
            document.getElementById('userPassword').required = true;
        }

        function editUser(id) {
            const user = allUsers.find(u => u.id === id);
            if (user) {
                editingId = id;
                document.getElementById('userName').value = user.full_name;
                document.getElementById('userUsername').value = user.username;
                document.getElementById('userRole').value = user.role;
                document.getElementById('userBranch').value = user.branch_id || '';
                document.getElementById('userStatus').value = user.status;
                document.getElementById('modalTitle').textContent = 'Edit User';
                document.getElementById('passwordDiv').style.display = 'none';
                document.getElementById('userPassword').required = false;
                new bootstrap.Modal(document.getElementById('userModal')).show();
            }
        }

        async function saveUser(event) {
            event.preventDefault();

            const data = {
                full_name: document.getElementById('userName').value.trim(),
                username: document.getElementById('userUsername').value.trim(),
                role: document.getElementById('userRole').value,
                branch_id: document.getElementById('userBranch').value || null,
                status: document.getElementById('userStatus').value
            };

            if (!data.full_name || !data.username || !data.role) {
                showError('Please fill all required fields');
                return;
            }

            if (!editingId && !document.getElementById('userPassword').value) {
                showError('Password is required for new users');
                return;
            }

            if (!editingId) {
                data.password = document.getElementById('userPassword').value;
            }

            try {
                let response;
                if (editingId) {
                    response = await api.updateUser(editingId, data);
                } else {
                    response = await api.createUser(data);
                }

                if (response.success) {
                    showSuccess(editingId ? 'User updated' : 'User created');
                    bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
                    loadData();
                } else {
                    showError(response.message);
                }
            } catch (error) {
                showError(error.message);
            }
        }

        async function resetPassword(id) {
            const newPassword = prompt('Enter new password (min 8 characters):');
            if (!newPassword || newPassword.length < 8) {
                showError('Password must be at least 8 characters');
                return;
            }

            try {
                const response = await api.resetUserPassword(id, newPassword);
                if (response.success) {
                    showSuccess('Password reset successfully');
                } else {
                    showError(response.message);
                }
            } catch (error) {
                showError(error.message);
            }
        }

        async function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                try {
                    await auth.logout();
                    showSuccess('Logged out successfully');
                    setTimeout(() => window.location.href = '../index.html', 1000);
                } catch (error) {
                    showError('Logout failed');
                }
            }
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
