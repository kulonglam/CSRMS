<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - CSRMS</title>
<link rel="stylesheet" href="../css/style.css">
    <script src="../js/layout.js"></script>
</head>
<body>
    <!-- Navigation -->
        <div id="appNavbar"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <ul class="sidebar-menu" id="sidebarMenu"></ul>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <div class="dashboard-header d-flex justify-content-between align-items-center">
                    <div>
                        <h1><i class="fas fa-users me-2"></i>Users</h1>
                        <p>Manage system users and permissions</p>
                    </div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal" onclick="resetForm()">
                        <i class="fas fa-plus me-2"></i>Add User
                    </button>
                </div>

                <!-- Search & Filter -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="searchInput" placeholder="Search users..." onkeyup="filterTable()">
                    </div>
                    <div class="col-md-6">
                        <select class="form-control" id="roleFilter" onchange="filterTable()">
                            <option value="">All Roles</option>
                            <option value="director">Director</option>
                            <option value="manager">Manager</option>
                            <option value="sales_agent">Sales Agent</option>
                        </select>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Branch</th>
                                <th>Status</th>
                                <th class="actions-col">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                            <tr>
                                <td colspan="8" class="text-center text-muted py-4">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="userForm" onsubmit="saveUser(event)">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="userFullName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="userUsername" required>
                            <div class="form-text" id="usernameHelp" style="display:none">Username can be updated for existing accounts.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="userEmail">Email</label>
                            <input type="email" class="form-control" id="userEmail" autocomplete="email" placeholder="For password reset notifications">
                            <div class="form-text">Optional, but required for self-service password reset.</div>
                        </div>
                        <div class="mb-3" id="passwordDiv">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="userPassword">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select class="form-control" id="userRole" required>
                                <option value="">Select Role</option>
                                <option value="director">Director</option>
                                <option value="manager">Manager</option>
                                <option value="sales_agent">Sales Agent</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Branch</label>
                            <select class="form-control" id="userBranch">
                                <option value="">No Branch (Directors Only)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-control" id="userStatus">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Reset Password Modal -->
    <div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-labelledby="resetPasswordTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="resetPasswordTitle">
                        <i class="fas fa-key me-2 text-warning" aria-hidden="true"></i>Reset user password
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="resetPasswordForm">
                    <div class="modal-body">
                        <p class="text-muted small mb-3" id="resetPasswordUserLabel"></p>
                        <div id="resetPasswordFeedback" class="d-none mb-3" role="alert"></div>
                        <div class="mb-3">
                            <label class="form-label" for="resetPasswordInput">New password</label>
                            <input type="password" class="form-control" id="resetPasswordInput" minlength="8" autocomplete="new-password" required>
                            <div class="form-text">Minimum 8 characters</div>
                        </div>
                        <div class="mb-0">
                            <label class="form-label" for="resetPasswordConfirm">Confirm password</label>
                            <input type="password" class="form-control" id="resetPasswordConfirm" minlength="8" autocomplete="new-password" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-warning" id="resetPasswordSubmit">Reset password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    
    <script>
        CSRMSLayout.boot(async () => {requireAuth();
        if (!auth.hasRole('director')) {
            showError('Unauthorized: Director access required');
            setTimeout(() => auth.redirectToDashboard(), 1500);
        }
        initPage('users', { showBranch: false });

        const currentUserId = auth.getCurrentUser()?.id;
        let allUsers = [];
        let allBranches = [];
        let editingId = null;
        let resetPasswordUserId = null;
        const resetPasswordModalEl = document.getElementById('resetPasswordModal');
        const resetPasswordModal = bootstrap.Modal.getOrCreateInstance(resetPasswordModalEl);

        function setResetPasswordFeedback(message, type) {
            const el = document.getElementById('resetPasswordFeedback');
            if (!message) {
                el.className = 'd-none mb-3';
                el.textContent = '';
                return;
            }
            el.className = `alert alert-${type} mb-3`;
            el.textContent = message;
        }

        async function loadData() {
            try {
                const [usersData, branchesData] = await Promise.all([
                    api.getUsers(),
                    api.getBranches()
                ]);

                if (usersData.success) {
                    allUsers = usersData.data || [];
                    displayUsers(allUsers);
                }

                if (branchesData.success) {
                    allBranches = branchesData.data || [];
                    populateBranchSelect();
                }
            } catch (error) {
                showError('Failed to load data');
            }
        }

        function populateBranchSelect() {
            const branchSelect = document.getElementById('userBranch');
            branchSelect.innerHTML = '<option value="">No Branch (Directors Only)</option>' +
                allBranches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
        }

        function displayUsers(users) {
            const html = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.full_name}</td>
                    <td>${user.username}</td>
                    <td>${user.email || '—'}</td>
                    <td>${getRoleBadge(user.role)}</td>
                    <td>${user.branch_name || '-'}</td>
                    <td>${getStatusBadge(user.status)}</td>
                    <td class="actions-col">
                        <div class="action-buttons">
                            <button class="btn btn-sm btn-warning" onclick="editUser(${user.id})" title="Edit user">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-secondary" onclick="resetPassword(${user.id})" title="Reset password">
                                <i class="fas fa-key"></i>
                            </button>
                            ${user.id !== currentUserId ? `
                            <button class="btn btn-sm btn-danger" onclick="deleteUser(${user.id})" title="Delete user">
                                <i class="fas fa-trash"></i>
                            </button>` : ''}
                        </div>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="8" class="text-center text-muted">No users found</td></tr>';
            document.getElementById('usersTable').innerHTML = html;
        }

        function filterTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const role = document.getElementById('roleFilter').value;

            const filtered = allUsers.filter(user => {
                const matchesSearch = user.full_name.toLowerCase().includes(searchTerm) || 
                                     user.username.toLowerCase().includes(searchTerm);
                const matchesRole = !role || user.role === role;
                return matchesSearch && matchesRole;
            });

            displayUsers(filtered);
        }

        function resetForm() {
            editingId = null;
            document.getElementById('userForm').reset();
            document.getElementById('modalTitle').textContent = 'Add User';
            document.getElementById('passwordDiv').style.display = 'block';
            document.getElementById('userPassword').required = true;
            document.getElementById('usernameHelp').style.display = 'none';
        }

        function editUser(id) {
            const user = allUsers.find(u => u.id === id);
            if (user) {
                editingId = id;
                document.getElementById('userFullName').value = user.full_name;
                document.getElementById('userUsername').value = user.username;
                document.getElementById('userEmail').value = user.email || '';
                document.getElementById('userRole').value = user.role;
                document.getElementById('userBranch').value = user.branch_id || '';
                document.getElementById('userStatus').value = user.status;
                document.getElementById('modalTitle').textContent = 'Edit User';
                document.getElementById('passwordDiv').style.display = 'none';
                document.getElementById('userPassword').required = false;
                document.getElementById('usernameHelp').style.display = 'block';
                new bootstrap.Modal(document.getElementById('userModal')).show();
            }
        }

        async function saveUser(event) {
            event.preventDefault();

            const data = {
                full_name: document.getElementById('userFullName').value.trim(),
                username: document.getElementById('userUsername').value.trim(),
                email: document.getElementById('userEmail').value.trim() || null,
                role: document.getElementById('userRole').value,
                branch_id: document.getElementById('userBranch').value || null,
                status: document.getElementById('userStatus').value
            };

            if (!data.full_name || !data.username || !data.role) {
                showError('Please fill all required fields');
                return;
            }

            if (!editingId && !document.getElementById('userPassword').value) {
                showError('Password is required for new users');
                return;
            }

            if (!editingId) {
                data.password = document.getElementById('userPassword').value;
            } else {
                data.username = document.getElementById('userUsername').value.trim();
            }

            try {
                let response;
                if (editingId) {
                    response = await api.updateUser(editingId, data);
                } else {
                    response = await api.createUser(data);
                }

                if (response.success) {
                    showSuccess(editingId ? 'User updated' : 'User created');
                    bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
                    loadData();
                } else {
                    showError(response.message);
                }
            } catch (error) {
                showError(error.message);
            }
        }

        function resetPassword(id) {
            const user = allUsers.find(u => u.id === id);
            if (!user) return;

            resetPasswordUserId = id;
            document.getElementById('resetPasswordUserLabel').textContent =
                `Set a new password for ${user.full_name} (${user.username}).`;
            document.getElementById('resetPasswordForm').reset();
            setResetPasswordFeedback('');
            resetPasswordModal.show();
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            setResetPasswordFeedback('');

            const newPassword = document.getElementById('resetPasswordInput').value;
            const confirmPassword = document.getElementById('resetPasswordConfirm').value;

            if (newPassword.length < 8) {
                setResetPasswordFeedback('Password must be at least 8 characters.', 'danger');
                return;
            }
            if (newPassword !== confirmPassword) {
                setResetPasswordFeedback('Passwords do not match.', 'danger');
                return;
            }

            const submitBtn = document.getElementById('resetPasswordSubmit');
            submitBtn.disabled = true;
            try {
                const response = await api.resetUserPassword(resetPasswordUserId, newPassword);
                if (response.success) {
                    resetPasswordModal.hide();
                    showSuccess('Password reset successfully');
                } else {
                    setResetPasswordFeedback(response.message || 'Failed to reset password.', 'danger');
                }
            } catch (error) {
                setResetPasswordFeedback(error.message || 'Failed to reset password.', 'danger');
            } finally {
                submitBtn.disabled = false;
            }
        });

        async function deleteUser(id) {
            const user = allUsers.find(u => u.id === id);
            if (!user) return;

            if (!await confirmAction({
                title: 'Delete User',
                message: `Are you sure you want to delete ${user.full_name}? Users with sales or activity history will be deactivated instead.`,
                confirmLabel: 'Delete',
            })) return;

            try {
                const response = await api.deleteUser(id);
                if (response.success) {
                    showSuccess(response.message || 'User deleted');
                    loadData();
                } else {
                    showError(response.message);
                }
            } catch (error) {
                showError(error.message);
            }
        }

        await loadData();
        CSRMSLayout.expose(filterTable, resetForm, editUser, resetPassword, saveUser, deleteUser);
    }, {});
    </script>
</body>
</html>
