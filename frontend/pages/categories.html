<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - CSRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🏪 CSRMS</a>
            <div class="d-flex align-items-center gap-2">
                <span class="text-light me-3">
                    <i class="fas fa-user-circle me-2"></i><span id="userName">User</span>
                </span>
                <button class="btn btn-outline-light btn-sm" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <ul class="sidebar-menu">
                    <li><a href="dashboard-director.html"><i class="fas fa-chart-line me-2"></i>Dashboard</a></li>
                    <li><a href="#" class="active"><i class="fas fa-list me-2"></i>Categories</a></li>
                    <li><a href="products.html"><i class="fas fa-box me-2"></i>Products</a></li>
                    <li><a href="branches.html"><i class="fas fa-sitemap me-2"></i>Branches</a></li>
                    <li><a href="users.html"><i class="fas fa-users me-2"></i>Users</a></li>
                    <li><a href="inventory.html"><i class="fas fa-warehouse me-2"></i>Inventory</a></li>
                    <li><a href="sales.html"><i class="fas fa-shopping-cart me-2"></i>Sales</a></li>
                    <li><a href="reports.html"><i class="fas fa-file-chart-line me-2"></i>Reports</a></li>
                    <li><a href="audit-logs.html"><i class="fas fa-history me-2"></i>Audit Logs</a></li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <div class="dashboard-header d-flex justify-content-between align-items-center">
                    <div>
                        <h1><i class="fas fa-list me-2"></i>Categories</h1>
                        <p>Manage product categories</p>
                    </div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#categoryModal" onclick="resetForm()">
                        <i class="fas fa-plus me-2"></i>Add Category
                    </button>
                </div>

                <!-- Search & Filter -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="searchInput" placeholder="Search categories..." onkeyup="filterTable()">
                    </div>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categoriesTable">
                            <tr>
                                <td colspan="5" class="text-center text-muted py-4">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="categoryForm" onsubmit="saveCategory(event)">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Category Name</label>
                            <input type="text" class="form-control" id="categoryName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-control" id="categoryStatus">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>

    <script>
        requireAuth();
        document.getElementById('userName').textContent = auth.getCurrentUser()?.full_name || 'User';

        let allCategories = [];
        let editingId = null;

        async function loadCategories() {
            try {
                const data = await api.getCategories();
                if (data.success) {
                    allCategories = data.data || [];
                    displayCategories(allCategories);
                }
            } catch (error) {
                showError('Failed to load categories');
            }
        }

        function displayCategories(categories) {
            const html = categories.map(cat => `
                <tr>
                    <td>${cat.id}</td>
                    <td>${cat.name}</td>
                    <td>${getStatusBadge(cat.status)}</td>
                    <td>${formatDate(cat.created_at)}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-sm btn-warning" onclick="editCategory(${cat.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCategory(${cat.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="5" class="text-center text-muted">No categories found</td></tr>';
            document.getElementById('categoriesTable').innerHTML = html;
        }

        function filterTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allCategories.filter(cat => 
                cat.name.toLowerCase().includes(searchTerm)
            );
            displayCategories(filtered);
        }

        function resetForm() {
            editingId = null;
            document.getElementById('categoryForm').reset();
            document.getElementById('modalTitle').textContent = 'Add Category';
            document.getElementById('categoryStatus').value = 'active';
        }

        function editCategory(id) {
            const category = allCategories.find(c => c.id === id);
            if (category) {
                editingId = id;
                document.getElementById('categoryName').value = category.name;
                document.getElementById('categoryStatus').value = category.status;
                document.getElementById('modalTitle').textContent = 'Edit Category';
                new bootstrap.Modal(document.getElementById('categoryModal')).show();
            }
        }

        async function saveCategory(event) {
            event.preventDefault();

            const name = document.getElementById('categoryName').value.trim();
            const status = document.getElementById('categoryStatus').value;

            if (!name) {
                showError('Category name is required');
                return;
            }

            try {
                let response;
                if (editingId) {
                    response = await api.updateCategory(editingId, { name, status });
                } else {
                    response = await api.createCategory({ name, status });
                }

                if (response.success) {
                    showSuccess(editingId ? 'Category updated' : 'Category created');
                    bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
                    loadCategories();
                } else {
                    showError(response.message);
                }
            } catch (error) {
                showError(error.message);
            }
        }

        async function deleteCategory(id) {
            if (!confirm('Are you sure?')) return;
            try {
                const response = await api.deleteCategory(id);
                if (response.success) {
                    showSuccess('Category deleted');
                    loadCategories();
                } else {
                    showError(response.message);
                }
            } catch (error) {
                showError(error.message);
            }
        }

        async function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                try {
                    await auth.logout();
                    showSuccess('Logged out successfully');
                    setTimeout(() => window.location.href = '../index.html', 1000);
                } catch (error) {
                    showError('Logout failed');
                }
            }
        }

        window.addEventListener('DOMContentLoaded', loadCategories);
    </script>
</body>
</html>
