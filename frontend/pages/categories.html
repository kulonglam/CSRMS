<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - CSRMS</title>
<link rel="stylesheet" href="../css/style.css">
    <script src="../js/layout.js"></script>
</head>
<body>
    <!-- Navigation -->
        <div id="appNavbar"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar"><ul class="sidebar-menu" id="sidebarMenu"></ul></div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <div class="dashboard-header d-flex justify-content-between align-items-center">
                    <div>
                        <h1><i class="fas fa-list me-2"></i>Categories</h1>
                        <p>Manage product categories</p>
                    </div>
                    <button class="btn btn-primary" data-manager-only data-bs-toggle="modal" data-bs-target="#categoryModal" onclick="resetForm()">
                        <i class="fas fa-plus me-2"></i>Add Category
                    </button>
                </div>

                <!-- Search & Filter -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="searchInput" placeholder="Search categories..." onkeyup="filterTable()">
                    </div>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th class="actions-col">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categoriesTable">
                            <tr>
                                <td colspan="6" class="text-center text-muted py-4">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="categoryForm" onsubmit="saveCategory(event)">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Category Name</label>
                            <input type="text" class="form-control" id="categoryName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="categoryDescription" rows="2" placeholder="Optional category description"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-control" id="categoryStatus">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    
    <script>
        CSRMSLayout.boot(async () => {requireAuth();
        initPage('categories');

        let allCategories = [];
        let editingId = null;

        async function loadCategories() {
            try {
                const data = await api.getCategories();
                if (data.success) {
                    allCategories = data.data || [];
                    displayCategories(allCategories);
                }
            } catch (error) {
                showError('Failed to load categories');
            }
        }

        function displayCategories(categories) {
            const html = categories.map(cat => `
                <tr>
                    <td>${cat.id}</td>
                    <td>${cat.name}</td>
                    <td>${cat.description || '—'}</td>
                    <td>${getStatusBadge(cat.status)}</td>
                    <td>${formatDate(cat.created_at)}</td>
                    <td class="actions-col">
                        <div class="action-buttons" data-manager-only>
                            <button class="btn btn-sm btn-warning" onclick="editCategory(${cat.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCategory(${cat.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="6" class="text-center text-muted">No categories found</td></tr>';
            document.getElementById('categoriesTable').innerHTML = html;
            applyRoleRestrictions();
        }

        function filterTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allCategories.filter(cat => 
                cat.name.toLowerCase().includes(searchTerm)
            );
            displayCategories(filtered);
        }

        function resetForm() {
            editingId = null;
            document.getElementById('categoryForm').reset();
            document.getElementById('modalTitle').textContent = 'Add Category';
            document.getElementById('categoryStatus').value = 'active';
        }

        function editCategory(id) {
            const category = allCategories.find(c => c.id === id);
            if (category) {
                editingId = id;
                document.getElementById('categoryName').value = category.name;
                document.getElementById('categoryDescription').value = category.description || '';
                document.getElementById('categoryStatus').value = category.status;
                document.getElementById('modalTitle').textContent = 'Edit Category';
                new bootstrap.Modal(document.getElementById('categoryModal')).show();
            }
        }

        async function saveCategory(event) {
            event.preventDefault();

            const name = document.getElementById('categoryName').value.trim();
            const description = document.getElementById('categoryDescription').value.trim() || null;
            const status = document.getElementById('categoryStatus').value;

            if (!name) {
                showError('Category name is required');
                return;
            }

            const payload = { name, description, status };

            try {
                let response;
                if (editingId) {
                    response = await api.updateCategory(editingId, payload);
                } else {
                    response = await api.createCategory(payload);
                }

                if (response.success) {
                    showSuccess(editingId ? 'Category updated' : 'Category created');
                    bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
                    loadCategories();
                } else {
                    showError(response.message);
                }
            } catch (error) {
                showError(error.message);
            }
        }

        async function deleteCategory(id) {
            if (!await confirmAction({
                title: 'Delete Category',
                message: 'Are you sure you want to delete this category? This action cannot be undone.',
            })) return;
            try {
                const response = await api.deleteCategory(id);
                if (response.success) {
                    showSuccess('Category deleted');
                    loadCategories();
                } else {
                    showError(response.message);
                }
            } catch (error) {
                showError(error.message);
            }
        }

        loadCategories();
        CSRMSLayout.expose(filterTable, resetForm, editCategory, deleteCategory, saveCategory);
    }, {});
    </script>
</body>
</html>
