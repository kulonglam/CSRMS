<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — CSRMS</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/layout.js"></script>
</head>
<body>
    <div id="appNavbar"></div>

    <main class="container py-5" id="main-content" role="main">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="table-container p-4">
                    <h4 class="mb-1 fw-bold"><i class="fas fa-key me-2 text-primary"></i>Change password</h4>
                    <p class="text-muted small mb-4">Update your account credentials</p>
                    <div id="formFeedback" class="d-none mb-3" role="alert"></div>
                    <form id="changePasswordForm">
                        <div class="mb-3">
                            <label class="form-label" for="currentPassword">Current password</label>
                            <div class="password-toggle-wrap">
                                <input type="password" class="form-control" id="currentPassword" autocomplete="current-password" required>
                                <button type="button" class="password-toggle-btn" data-toggle-for="currentPassword" aria-label="Show password" aria-pressed="false">
                                    <i class="fas fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="newPassword">New password</label>
                            <div class="password-toggle-wrap">
                                <input type="password" class="form-control" id="newPassword" minlength="8" autocomplete="new-password" required>
                                <button type="button" class="password-toggle-btn" data-toggle-for="newPassword" aria-label="Show password" aria-pressed="false">
                                    <i class="fas fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <div class="form-text">Minimum 8 characters</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="confirmPassword">Confirm new password</label>
                            <div class="password-toggle-wrap">
                                <input type="password" class="form-control" id="confirmPassword" minlength="8" autocomplete="new-password" required>
                                <button type="button" class="password-toggle-btn" data-toggle-for="confirmPassword" aria-label="Show password" aria-pressed="false">
                                    <i class="fas fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" id="submitBtn">Update password</button>
                            <button type="button" class="btn btn-outline-secondary" id="cancelBtn">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="passwordSuccessModal" tabindex="-1" aria-labelledby="passwordSuccessTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="passwordSuccessTitle">
                        <i class="fas fa-check-circle me-2 text-success" aria-hidden="true"></i>Password updated
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Your password has been changed successfully. You can continue using the system with your new credentials.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="passwordSuccessContinue">Continue to dashboard</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        CSRMSLayout.boot(async () => {
            requireAuth();
            initPage(null, { navbarOnly: true });

            const form = document.getElementById('changePasswordForm');
            const feedback = document.getElementById('formFeedback');
            const submitBtn = document.getElementById('submitBtn');
            const successModalEl = document.getElementById('passwordSuccessModal');
            const successModal = bootstrap.Modal.getOrCreateInstance(successModalEl);

            function setFormFeedback(message, type) {
                if (!message) {
                    feedback.className = 'd-none mb-3';
                    feedback.textContent = '';
                    return;
                }
                feedback.className = `alert alert-${type} mb-3`;
                feedback.textContent = message;
            }

            document.querySelectorAll('.password-toggle-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const input = document.getElementById(btn.dataset.toggleFor);
                    const icon = btn.querySelector('i');
                    const show = input.type === 'password';
                    input.type = show ? 'text' : 'password';
                    icon.classList.toggle('fa-eye', !show);
                    icon.classList.toggle('fa-eye-slash', show);
                    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                    btn.setAttribute('aria-pressed', show ? 'true' : 'false');
                });
            });

            document.getElementById('cancelBtn').addEventListener('click', () => history.back());

            document.getElementById('passwordSuccessContinue').addEventListener('click', () => {
                successModal.hide();
                auth.redirectToDashboard();
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                setFormFeedback('');

                const current = document.getElementById('currentPassword').value;
                const newPass = document.getElementById('newPassword').value;
                const confirm = document.getElementById('confirmPassword').value;

                if (newPass !== confirm) {
                    setFormFeedback('Passwords do not match.', 'danger');
                    return;
                }

                submitBtn.disabled = true;
                try {
                    const res = await api.changePassword(current, newPass);
                    if (res.success) {
                        form.reset();
                        setFormFeedback('');
                        successModal.show();
                    } else {
                        setFormFeedback(res.message || 'Failed to update password.', 'danger');
                    }
                } catch (err) {
                    setFormFeedback(err.message || 'Failed to update password.', 'danger');
                } finally {
                    submitBtn.disabled = false;
                }
            });
        }, { utils: false });
    </script>
</body>
</html>
