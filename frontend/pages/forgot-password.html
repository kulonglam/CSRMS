<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — CSRMS</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/layout.js"></script>
</head>
<body>
    <main class="login-container">
        <div class="login-box">
            <div class="text-center mb-2">
                <div class="brand-mark" aria-hidden="true"><i class="fas fa-key"></i></div>
                <div class="brand-text">Reset password</div>
                <div class="subtitle">Enter your username to receive reset instructions</div>
            </div>
            <form onsubmit="handleForgot(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" autocomplete="username" required>
                </div>
                <button type="submit" class="btn-login">Send reset link</button>
            </form>
            <div id="devResetLink" class="mt-3" style="display:none"></div>
            <div class="text-center mt-3">
                <a href="../index.html" class="auth-link">Back to sign in</a>
            </div>
        </div>
    </main>
    <script>
        CSRMSLayout.boot(async () => {
            async function handleForgot(e) {
                e.preventDefault();
                const username = document.getElementById('username').value.trim();
                try {
                    const res = await api.forgotPassword(username);
                    showSuccess(res.message);
                    if (res.data?.reset_url) {
                        const el = document.getElementById('devResetLink');
                        el.style.display = 'block';
                        el.innerHTML = `<div class="alert alert-info small"><strong>Development only:</strong><br><a href="${res.data.reset_url}" class="auth-link">Reset password link</a></div>`;
                    }
                } catch (err) { showError(err.message); }
            }
            window.handleForgot = handleForgot;
        }, { nav: false, utils: false, styles: true });
    </script>
</body>
</html>
