<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CSRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="text-center mb-4">
                <div class="brand-text">🔑 Reset Password</div>
                <div class="subtitle">Enter your username to receive reset instructions</div>
            </div>
            <form onsubmit="handleForgot(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <button type="submit" class="btn btn-login">Send Reset Link</button>
            </form>
            <div id="devResetLink" class="mt-3" style="display:none"></div>
            <div class="text-center mt-3">
                <a href="../index.html">Back to login</a>
            </div>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        async function handleForgot(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            try {
                const res = await api.forgotPassword(username);
                showSuccess(res.message);
                if (res.data?.reset_url) {
                    const el = document.getElementById('devResetLink');
                    el.style.display = 'block';
                    el.innerHTML = `<div class="alert alert-info small"><strong>Development only:</strong><br><a href="${res.data.reset_url}">Reset password link</a></div>`;
                }
            } catch (err) { showError(err.message); }
        }
    </script>
</body>
</html>
