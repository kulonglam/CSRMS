<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier Balancing - CSRMS</title>
<link rel="stylesheet" href="../css/style.css">
    <script src="../js/layout.js"></script>
</head>
<body>
        <div id="appNavbar"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar"><ul class="sidebar-menu" id="sidebarMenu"></ul></div>
            <div class="col-md-10 p-4">
                <div class="dashboard-header"><h1><i class="fas fa-cash-register me-2"></i>Cashier Balancing</h1><p>Verify and reconcile daily cashier sales</p></div>

                <ul class="nav nav-tabs mb-3">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#balanceTab">Submit Balance</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#historyTab" onclick="loadHistory()">Balance History</button></li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="balanceTab">
                        <div class="row mb-3">
                            <div class="col-md-3"><input type="date" class="form-control" id="balanceDate" onchange="loadAgentSummary()"></div>
                            <div class="col-md-4">
                                <select class="form-control" id="agentSelect" onchange="loadAgentSummary()"><option value="">Select Cashier</option></select>
                            </div>
                        </div>

                        <div class="row" id="summarySection" style="display:none">
                            <div class="col-md-4"><div class="stat-card info"><div class="stat-value" id="expectedAmount">USh 0</div><div class="stat-label">Expected (Sales)</div></div></div>
                            <div class="col-md-4"><div class="stat-card success"><div class="stat-value" id="transactionCount">0</div><div class="stat-label">Transactions</div></div></div>
                        </div>

                        <div class="table-container mt-3 mb-3" id="salesListSection" style="display:none">
                            <div class="p-3 border-bottom"><h6 class="mb-0">Sales for Selected Date</h6></div>
                            <table class="table table-sm mb-0">
                                <thead><tr><th>Receipt</th><th>Time</th><th>Amount</th><th>Paid</th><th>Change</th></tr></thead>
                                <tbody id="agentSalesTable"></tbody>
                            </table>
                        </div>

                        <div class="table-container p-3" id="submitSection" style="display:none">
                            <h6>Submit Cash Collected</h6>
                            <form onsubmit="submitBalance(event)" class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">Cash Submitted</label>
                                    <input type="number" class="form-control" id="submittedAmount" step="0.01" min="0" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Notes</label>
                                    <input type="text" class="form-control" id="balanceNotes" placeholder="Optional notes">
                                </div>
                                <div class="col-md-2 d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary w-100">Submit</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="tab-pane fade" id="historyTab">
                        <div class="table-container">
                            <table class="table table-hover">
                                <thead><tr><th>Date</th><th>Agent</th><th>Expected</th><th>Submitted</th><th>Variance</th><th>Status</th><th>Actions</th></tr></thead>
                                <tbody id="historyTable"><tr><td colspan="7" class="text-center text-muted py-4">Loading...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="rejectBalanceModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-times-circle me-2 text-danger"></i>Reject balance</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="rejectBalanceForm">
                    <div class="modal-body">
                        <p class="text-muted small mb-3" id="rejectBalanceLabel"></p>
                        <label class="form-label" for="rejectReason">Reason for rejection</label>
                        <textarea class="form-control" id="rejectReason" rows="3" required placeholder="Explain what needs to be corrected"></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-danger">Reject</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    
    <script>
        CSRMSLayout.boot(async () => {requireAuth();
        if (!isManager()) { showError('Manager access required'); setTimeout(() => auth.redirectToDashboard(), 1500); }
        initPage('cashier-balancing');

        let agents = [];
        let rejectBalanceId = null;
        const rejectBalanceModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('rejectBalanceModal'));

        function balanceStatusBadge(status) {
            if (status === 'approved') return '<span class="badge bg-success">Approved</span>';
            if (status === 'pending') return '<span class="badge bg-info">Pending</span>';
            if (status === 'rejected') return '<span class="badge bg-danger">Rejected</span>';
            if (status === 'flagged') return '<span class="badge bg-warning text-dark">Flagged</span>';
            return `<span class="badge bg-secondary">${status}</span>`;
        }

        async function loadAgents() {
            const res = await api.getUsers();
            if (res.success) {
                agents = (res.data || []).filter(u => u.role === 'sales_agent');
                document.getElementById('agentSelect').innerHTML = '<option value="">Select Cashier</option>' +
                    agents.map(a => `<option value="${a.id}">${a.full_name}</option>`).join('');
            }
        }

        async function loadAgentSummary() {
            const agentId = document.getElementById('agentSelect').value;
            const date = document.getElementById('balanceDate').value;
            if (!agentId || !date) return;
            try {
                const res = await api.getAgentDailySummary(agentId, date);
                if (res.success) {
                    const d = res.data;
                    document.getElementById('summarySection').style.display = 'flex';
                    document.getElementById('salesListSection').style.display = 'block';
                    document.getElementById('submitSection').style.display = 'block';
                    document.getElementById('expectedAmount').textContent = formatCurrency(d.expected_amount);
                    document.getElementById('transactionCount').textContent = d.transaction_count;
                    document.getElementById('submittedAmount').value = d.balance?.submitted_amount ?? d.expected_amount ?? '';
                    document.getElementById('balanceNotes').value = d.balance?.notes || '';
                    if (d.balance?.status === 'pending') {
                        showSuccess('Agent has submitted cash — verify and approve.');
                    }
                    document.getElementById('agentSalesTable').innerHTML = (d.sales || []).map(s => `
                        <tr><td><code>${s.receipt_number}</code></td><td>${formatDate(s.created_at)}</td>
                        <td>${formatCurrency(s.total_amount)}</td><td>${formatCurrency(s.amount_paid)}</td><td>${formatCurrency(s.change_given)}</td></tr>
                    `).join('') || '<tr><td colspan="5" class="text-muted text-center">No sales</td></tr>';
                }
            } catch (e) { showError(e.message); }
        }

        async function submitBalance(e) {
            e.preventDefault();
            const data = {
                sales_agent_id: parseInt(document.getElementById('agentSelect').value),
                submitted_amount: parseFloat(document.getElementById('submittedAmount').value),
                balance_date: document.getElementById('balanceDate').value,
                notes: document.getElementById('balanceNotes').value.trim() || null,
            };
            try {
                const res = await api.submitCashierBalance(data);
                if (res.success) { showSuccess(res.message); loadHistory(); }
            } catch (err) { showError(err.message); }
        }

        async function loadHistory() {
            try {
                const res = await api.getCashierBalances();
                const items = res.success ? res.data : [];
                document.getElementById('historyTable').innerHTML = items.map(r => `
                    <tr>
                        <td>${formatDate(r.balance_date)}</td><td>${r.agent_name}</td>
                        <td>${formatCurrency(r.expected_amount)}</td><td>${formatCurrency(r.submitted_amount)}</td>
                        <td>${formatCurrency(r.variance)}</td>
                        <td>${balanceStatusBadge(r.status)}</td>
                        <td>${['pending', 'flagged'].includes(r.status) ? `
                            <div class="d-flex gap-1">
                                <button type="button" class="btn btn-sm btn-success btn-approve-balance" data-id="${r.id}">Approve</button>
                                <button type="button" class="btn btn-sm btn-outline-danger btn-reject-balance" data-id="${r.id}" data-agent="${encodeURIComponent(r.agent_name)}">Reject</button>
                            </div>` : r.status === 'rejected' ? '<span class="text-muted small">Awaiting agent resubmit</span>' : ''}</td>
                    </tr>
                `).join('') || '<tr><td colspan="7" class="text-center text-muted">No records</td></tr>';
            } catch (e) { showError(e.message); }
        }

        async function approveBalance(id) {
            if (!await confirmAction({
                title: 'Approve Balance',
                message: 'Approve this balance record?',
                confirmLabel: 'Approve',
                confirmClass: 'btn-success',
            })) return;
            try {
                const res = await api.approveCashierBalance(id);
                if (res.success) { showSuccess('Balance approved'); loadHistory(); loadAgentSummary(); }
            } catch (e) { showError(e.message); }
        }

        function openRejectBalance(id, agentName) {
            rejectBalanceId = id;
            document.getElementById('rejectBalanceLabel').textContent =
                `Reject the cash submission for ${agentName}. The agent will need to resubmit.`;
            document.getElementById('rejectReason').value = '';
            rejectBalanceModal.show();
        }

        document.getElementById('rejectBalanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const reason = document.getElementById('rejectReason').value.trim();
            if (!reason) return;
            try {
                const res = await api.rejectCashierBalance(rejectBalanceId, reason);
                if (res.success) {
                    rejectBalanceModal.hide();
                    showSuccess(res.message || 'Balance rejected');
                    loadHistory();
                    loadAgentSummary();
                }
            } catch (err) { showError(err.message); }
        });

        document.getElementById('historyTable').addEventListener('click', (e) => {
            const approveBtn = e.target.closest('.btn-approve-balance');
            const rejectBtn = e.target.closest('.btn-reject-balance');
            if (approveBtn) approveBalance(Number(approveBtn.dataset.id));
            if (rejectBtn) {
                openRejectBalance(Number(rejectBtn.dataset.id), decodeURIComponent(rejectBtn.dataset.agent));
            }
        });

        document.getElementById('balanceDate').value = new Date().toISOString().split('T')[0];
        loadAgents();
        CSRMSLayout.expose(loadHistory, loadAgentSummary, submitBalance, approveBalance, openRejectBalance);
    }, {});
    </script>
</body>
</html>
