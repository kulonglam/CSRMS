<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — CSRMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-page">
        <main class="login-container">
            <div class="login-box">
                <div class="text-center mb-2">
                    <div class="brand-mark" aria-hidden="true"><i class="fas fa-store"></i></div>
                    <div class="brand-text">Welcome back</div>
                    <div class="subtitle">Sign in to Crown Stores Retail Management System</div>
                </div>

                <form id="loginForm" novalidate>
                    <div id="loginFeedback" class="d-none mb-3" role="alert"></div>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Enter your username" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-toggle-wrap">
                            <input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                            <button type="button" class="password-toggle-btn" id="togglePassword" aria-label="Show password" aria-pressed="false">
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-login" id="loginBtn">
                        <span id="loginText">Sign in</span>
                        <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2" style="display:none;" aria-hidden="true"></span>
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="pages/forgot-password.html" class="auth-link">Forgot password?</a>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function setLoginFeedback(message, type) {
            const el = document.getElementById('loginFeedback');
            if (!message) {
                el.className = 'd-none mb-3';
                el.textContent = '';
                return;
            }
            el.className = `alert alert-${type} mb-3`;
            el.textContent = message;
        }

        async function ensureCsrmsServer() {
            if (window.location.protocol === 'file:') {
                setLoginFeedback(
                    'Open the app through the server: run npm run dev, then go to http://localhost:5000',
                    'danger'
                );
                return false;
            }
            const ok = await api.ensureServerConnection();
            if (!ok) {
                setLoginFeedback(
                    'CSRMS server not found. In the project folder run npm run dev, then open http://localhost:5000',
                    'danger'
                );
                return false;
            }
            return true;
        }

        (async () => {
            const serverOk = await ensureCsrmsServer();
            if (!serverOk || !window.auth?.isAuthenticated()) return;
            try {
                await api.getCurrentUser();
                window.auth.redirectToDashboard();
            } catch {
                window.auth.clearSession();
            }
        })();

        async function handleLogin(event) {
                event.preventDefault();
                setLoginFeedback('');
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const loginBtn = document.getElementById('loginBtn');
                const loginText = document.getElementById('loginText');
                const loginSpinner = document.getElementById('loginSpinner');

                if (!username || !password) {
                    const msg = 'Username and password are required';
                    setLoginFeedback(msg, 'danger');
                    showError(msg);
                    return;
                }

                try {
                    loginBtn.disabled = true;
                    loginText.style.display = 'none';
                    loginSpinner.style.display = 'inline-block';
                    if (!(await ensureCsrmsServer())) return;
                    const response = await window.auth.login(username, password);
                    if (response.success) {
                        showSuccess('Login successful! Redirecting…');
                        setTimeout(() => window.auth.redirectToDashboard(), 1200);
                    } else {
                        const msg = response.message || 'Login failed';
                        setLoginFeedback(msg, 'danger');
                        showError(msg);
                    }
                } catch (error) {
                    const msg = error.message || 'Login failed. Please try again.';
                    setLoginFeedback(msg, 'danger');
                    showError(msg);
                } finally {
                    loginBtn.disabled = false;
                    loginText.style.display = 'inline';
                    loginSpinner.style.display = 'none';
                }
            }

        window.handleLogin = handleLogin;
        document.getElementById('loginForm').addEventListener('submit', handleLogin);

        document.getElementById('togglePassword').addEventListener('click', () => {
            const input = document.getElementById('password');
            const btn = document.getElementById('togglePassword');
            const icon = btn.querySelector('i');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !show);
            icon.classList.toggle('fa-eye-slash', show);
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            btn.setAttribute('aria-pressed', show ? 'true' : 'false');
        });
    </script>
</body>
</html>
